# SPDX-License-Identifier: GPL-3.0-only
name: Build owned Java archives
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/korhojoa/qnx650-compiler@sha256:85f95b995d4b5dc2c323a6842c29b5c08652f34cc2288f6cc745534f5b2ecc7a
    steps:
      - name: Get source
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git fetch --no-tags --depth=1 "$REPOSITORY_URL" "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
      - name: Fetch compiler
        run: python3 -B tools/java-compiler.py /opt/owned-jdk8
      - name: Build and test
        env:
          JAVA_HOME: /opt/owned-jdk8
          OWNED_JAVA_DIRECT: '1'
        run: ./build.sh
