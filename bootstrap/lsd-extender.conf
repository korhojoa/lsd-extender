# Wireless Android Auto and owned settings pages.
jar lsd-extender-wirelessaa.jar
jar lsd-extender-homeui.jar
feature org.korho.lsdextender.homescreen.HomeUiFeature
jar lsd-extender-aasettings.jar
feature org.korho.lsdextender.aasettings.AndroidAutoSettingsService
feature org.korho.lsdextender.aasettings.CarPlaySettingsService
# Cluster turn guidance, stream state and vehicle energy.
jar lsd-extender-aa-guidance.jar
jar lsd-extender-kombisync.jar
jar lsd-extender-ev.jar
# AA turn data to the cluster arrows: true | false.
lsdextender.nav.aa=true
# Cluster turn-to line: empty means no text.
lsdextender.nav.turnto=
# Cluster signpost line: empty means no text.
lsdextender.nav.turnto.sign=
# Stock restart control: true | false.
lsdextender.restart.enabled=false
# CarPlay settings file: auto uses the native configuration locations.
prop lsdextender.carplay.config=auto
# Watch Bluetooth-connected phones: true | false.
lsdextender.wireless.bt=true
# Connect when an allowed phone appears: true | false.
lsdextender.wireless.autoconnect=false
# Virtual USB driver and wireless network information.
spawn sh /fs/sdb0/lsd-extender/mount-vaa.sh
spawn sh /fs/sdb0/lsd-extender/run-native-aa-creds.sh
# TCP command listener: 0 disables spawn, reload and other commands.
lsdextender.publish.port=0
# Open its firewall port: true | false.
lsdextender.publish.pf=false
# Wireless TCP port is open only on the access point.
lsdextender.wireless.pf=true
lsdextender.publish.pf_ifaces=$wlan_if
# Optional diagnostics and input are off.
lsdextender.dsispy.enabled=false
lsdextender.dsispy.slog=false
lsdextender.keys.enabled=false
lsdextender.input.trace=false
lsdextender.touch.slog=false
lsdextender.vehicle_probe.enabled=false
# Optional vehicle probing stays read-only.
lsdextender.vehicle_probe.read_only=true
lsdextender.nav.destination=false
# No update worker or game directory is supplied by this release.
lsdextender.updates.worker=/dev/null
lsdextender.updates.agent.config=/dev/null
lsdextender.games.directory=/dev/null
